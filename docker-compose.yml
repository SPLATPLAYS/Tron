version: '3.8'

services:
  peerjs-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '${PORT:-9000}:9000'
    environment:
      - PORT=9000
      - PEER_PATH=/peerjs
      - PEER_KEY=peerjs
      - PEER_DEBUG=0
      - METERED_API_KEY=${METERED_API_KEY:-}
      - TURN_API_KEY=${TURN_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "const http=require('http');const req=http.get('http://localhost:9000/health',r=>{process.exit(r.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
